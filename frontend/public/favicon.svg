<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fundo escuro -->
  <rect width="200" height="200" rx="40" fill="#0A0F1E"/>
  <!-- Antena -->
  <line x1="100" y1="20" x2="100" y2="40" stroke="#A3E635" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="18" r="6" fill="#A3E635"/>
  <!-- Corpo -->
  <rect x="50" y="40" width="100" height="90" rx="22" fill="#1C2235" stroke="#A3E635" stroke-width="3"/>
  <!-- Tela -->
  <rect x="62" y="55" width="76" height="56" rx="12" fill="#0A0F1E"/>
  <!-- Olhos -->
  <circle cx="84" cy="82" r="7" fill="#A3E635"/>
  <circle cx="116" cy="82" r="7" fill="#A3E635"/>
  <!-- Sorriso -->
  <path d="M 82 100 Q 100 110 118 100" stroke="#A3E635" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Braços -->
  <rect x="42" y="70" width="10" height="24" rx="3" fill="#1C2235" stroke="#A3E635" stroke-width="2"/>
  <rect x="148" y="70" width="10" height="24" rx="3" fill="#1C2235" stroke="#A3E635" stroke-width="2"/>
  <!-- Pescoço -->
  <rect x="92" y="130" width="16" height="10" fill="#1C2235" stroke="#A3E635" stroke-width="2"/>
  <!-- Base -->
  <rect x="58" y="140" width="84" height="44" rx="14" fill="#141824" stroke="#A3E635" stroke-width="3"/>
  <!-- Botões coloridos -->
  <circle cx="78" cy="162" r="4" fill="#34D399"/>
  <circle cx="100" cy="162" r="4" fill="#3B82F6"/>
  <circle cx="122" cy="162" r="4" fill="#F97316"/>
</svg>
